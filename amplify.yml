version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: '/'
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
            - corepack enable && corepack prepare pnpm@11.25.0 --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - env | grep -e '^AWS_REGION=' -e '^COGNITO_USER_POOL_ID=' -e '^COGNITO_APP_CLIENT_ID=' -e '^APP_ENV=' -e '^BACKEND_API_URL=' -e '^GATEWAY_SECRET=' -e '^SERVICE_URL_' >> apps/web/.env.production
            - pnpm --filter @monevo/web build
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - apps/web/.next/cache/**/*
