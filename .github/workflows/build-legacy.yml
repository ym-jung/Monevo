name: build-legacy

# on:
#   pull_request:
#   push:
#     branches: [main]

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-legacy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: legacy/api-jvm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - run: chmod +x gradlew

      - run: ./gradlew build --no-daemon

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: legacy/api-jvm/build/reports/tests/test
          retention-days: 7

  fx-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: legacy/fx-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: legacy/fx-service/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest -q
