name: build-and-push-legacy

# on:
#   push:
#     tags:
#       - "v*"
#   workflow_call:
#     inputs:
#       tag:
#         description: "이미지 태그 (release.yml 이 v<version> 을 넘긴다)"
#         required: true
#         type: string

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "이미지 태그 (비우면 커밋 SHA)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/build-legacy.yml

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-jvm
            context: legacy/api-jvm
          - name: fx-service
            context: legacy/fx-service
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/monevo-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v') }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
