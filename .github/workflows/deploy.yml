name: deploy

on:
  push:
    branches: [main, production]
    paths:
      - "services/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [staging, prod]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment || (github.ref_name == 'production' && 'prod' || 'staging') }}
    concurrency:
      group: deploy-${{ inputs.environment || (github.ref_name == 'production' && 'prod' || 'staging') }}
      cancel-in-progress: false
    env:
      MONEVO_ENV: ${{ inputs.environment || (github.ref_name == 'production' && 'prod' || 'staging') }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - run: |
          for service in meta user account report ledger journal; do
            pnpm --filter "@monevo/$service" build
            (cd "services/$service/dist" && zip -q -r ../function.zip .)
            aws lambda update-function-code --publish \
              --function-name "monevo-$MONEVO_ENV-$service" \
              --zip-file "fileb://services/$service/function.zip" \
              --query '{name:FunctionName,version:Version,size:CodeSize}' --output table
          done

      - run: |
          for service in meta user account report ledger journal; do
            aws lambda wait function-updated-v2 --function-name "monevo-$MONEVO_ENV-$service"
          done

      - run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.API_BASE_URL }}/api/v1/meta/currencies")
          echo "unauthenticated meta -> $code"
          [ "$code" = "403" ] || { echo "expected 403 from the gateway check"; exit 1; }
