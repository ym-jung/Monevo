name: ✨ 기능 요청
description: 새로운 기능이나 개선 사항을 제안합니다
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        제안해 주셔서 감사합니다. 아래 항목을 작성해 주시면 검토에 도움이 됩니다.

  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제와 관련이 있나요?
      description: 이 기능 요청이 해결하려는 문제나 불편함을 설명해 주세요.
      placeholder: "예) ~할 때마다 매번 ~해야 해서 불편합니다."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결 방법
      description: 원하시는 기능이나 동작 방식을 구체적으로 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 다른 방법이나 우회책을 고려해 보셨다면 작성해 주세요.
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위 (참고용)
      options:
        - "낮음 - 있으면 좋음"
        - "보통 - 개선에 도움됨"
        - "높음 - 업무에 지장이 있음"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 스크린샷, 참고 링크 등 그 밖에 참고할 내용을 작성해 주세요.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 동일한 요청이 이미 등록되어 있지 않은지 검색해 확인했습니다.
          required: true
