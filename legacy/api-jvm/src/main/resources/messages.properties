INTERNAL_ERROR=An unexpected error occurred. Please try again in a moment.
VALIDATION_FAILED=Some of the values sent are not valid. Check the details.
NOT_FOUND=The requested resource was not found.
METHOD_NOT_ALLOWED=That method is not allowed on this path.
CONCURRENT_MODIFICATION=Someone changed this while you were editing. Reload and try again.
RATE_LIMITED=Too many requests. Please try again in a moment.

UNAUTHENTICATED=Sign-in is required.
TOKEN_EXPIRED=The session has expired. Please sign in again.
TOKEN_INVALID=The token is not valid.
AUTH_USER_NOT_PROVISIONED=This account has not been set up yet. Contact an administrator.
FORBIDDEN=You do not have permission for this.
ADMIN_REQUIRED=This needs administrator permission.

EMAIL_ALREADY_EXISTS=That email is already in use.
USER_PENDING_APPROVAL=This account is waiting for administrator approval.
USER_REJECTED=This account was rejected.
USER_SUSPENDED=This account is suspended.
USER_NOT_FOUND=User not found.
USER_ALREADY_PROCESSED=This request has already been handled.
CANNOT_MODIFY_SELF=You cannot change your own account this way.

LEDGER_NOT_FOUND=Ledger not found.
LEDGER_NOT_MEMBER=You are not a member of this ledger.
LEDGER_OWNER_REQUIRED=Only the ledger owner can do this.
LEDGER_CURRENCY_CONFIRM_REQUIRED=The base currency cannot be changed later. Confirm before continuing.
LEDGER_OWNER_CANNOT_LEAVE=The owner cannot leave. Hand the ledger over first.
LEDGER_SINGLE_OWNER_VIOLATION=A ledger has exactly one owner.

INVITE_NOT_FOUND=Invite code not found.
INVITE_EXPIRED=This invite code has expired.
INVITE_REVOKED=This invite code was revoked.
INVITE_EXHAUSTED=This invite code has been used up.
INVITE_ALREADY_MEMBER=You are already a member of this ledger.
INVITE_CODE_DUPLICATED=Could not issue an invite code. Please try again.

ACCOUNT_NOT_FOUND=Account not found.
ACCOUNT_NOT_ACCESSIBLE=This account cannot be used in this ledger.
ACCOUNT_NAME_DUPLICATED=You already have an account with that name.
ACCOUNT_ARCHIVED=This account is archived.
ACCOUNT_HAS_TRANSACTIONS=This account has transactions on it. Archive it instead of deleting.
ACCOUNT_SHARE_TARGET_INVALID=You cannot share an account into a ledger you are not a member of.
ACCOUNT_NATURE_INVALID=That account cannot be used this way.
OPENING_BALANCE_ALREADY_SET=This account already has an opening balance.

CATEGORY_NOT_FOUND=Category not found.
CATEGORY_DEPTH_EXCEEDED=Categories go two levels deep at most.
CATEGORY_KIND_MISMATCH=A child category has to match its parent's kind.
CATEGORY_NOT_LEAF=Transactions can only go on a category with no children.
CATEGORY_NAME_DUPLICATED=A category with that name already exists under the same parent.
CATEGORY_HAS_CHILDREN=This category has child categories.
CATEGORY_HAS_TRANSACTIONS=This category already has transactions on it.
CATEGORY_LEDGER_MISMATCH=That category belongs to a different ledger.

TRANSACTION_CURRENCY_MISMATCH=The currency has to match the account's currency.
TRANSACTION_AMOUNT_INVALID=The amount has to be greater than zero.
TRANSACTION_IDEMPOTENCY_KEY_REUSED=This transaction request key was already used for different content.

FX_RATE_UNAVAILABLE=No exchange rate is available for that date.
FX_SERVICE_UNAVAILABLE=The exchange rate service is not responding. Please try again in a moment.
FX_RATE_INVALID=The exchange rate is not a valid value.
CURRENCY_NOT_SUPPORTED=That currency is not supported.

JOURNAL_ENTRY_NOT_FOUND=Entry not found.
JOURNAL_ENTRY_UNBALANCED=The debits and credits do not add up to the same amount.
JOURNAL_ENTRY_SHAPE_INVALID=An entry needs at least one debit line and one credit line.
JOURNAL_LINE_ACCOUNT_INVALID=That account cannot take a line on this entry.
JOURNAL_LINE_DUPLICATE_ACCOUNT=The same account cannot be on both sides of one entry.
