server:
  port: ${SERVER_PORT:8083}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monevo_dev}
    username: ${DB_USER:monevo}
    password: ${DB_PASSWORD:monevo}

app:
  cognito:
    user-pool-id: ${COGNITO_USER_POOL_ID:ap-northeast-1_devDummy0}
    app-client-id: ${COGNITO_APP_CLIENT_ID:dev-dummy-client-id}
  cors:
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:false}

logging:
  level:
    com.monevo: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
