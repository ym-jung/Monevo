name: monevo-prod

spring:
  flyway:
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: WARN
    com.monevo: INFO
