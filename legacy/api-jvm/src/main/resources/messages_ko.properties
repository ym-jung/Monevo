INTERNAL_ERROR=예기치 못한 오류가 발생했습니다. 잠시 후 다시 시도해주세요.
VALIDATION_FAILED=입력값이 올바르지 않습니다. 상세 항목을 확인해주세요.
NOT_FOUND=요청한 리소스를 찾을 수 없습니다.
METHOD_NOT_ALLOWED=이 경로에서는 사용할 수 없는 메서드입니다.
CONCURRENT_MODIFICATION=편집하는 사이에 다른 곳에서 값이 바뀌었습니다. 새로 불러온 뒤 다시 시도해주세요.
RATE_LIMITED=요청이 너무 많습니다. 잠시 후 다시 시도해주세요.

UNAUTHENTICATED=로그인이 필요합니다.
TOKEN_EXPIRED=세션이 만료되었습니다. 다시 로그인해주세요.
TOKEN_INVALID=유효하지 않은 토큰입니다.
AUTH_USER_NOT_PROVISIONED=아직 준비되지 않은 계정입니다. 관리자에게 문의해주세요.
FORBIDDEN=권한이 없습니다.
ADMIN_REQUIRED=관리자 권한이 필요합니다.

EMAIL_ALREADY_EXISTS=이미 사용 중인 이메일입니다.
USER_PENDING_APPROVAL=관리자 승인을 기다리는 계정입니다.
USER_REJECTED=가입이 거절된 계정입니다.
USER_SUSPENDED=이용이 정지된 계정입니다.
USER_NOT_FOUND=사용자를 찾을 수 없습니다.
USER_ALREADY_PROCESSED=이미 처리된 요청입니다.
CANNOT_MODIFY_SELF=본인 계정에는 할 수 없는 작업입니다.

LEDGER_NOT_FOUND=가계부를 찾을 수 없습니다.
LEDGER_NOT_MEMBER=이 가계부의 멤버가 아닙니다.
LEDGER_OWNER_REQUIRED=가계부 소유자만 할 수 있습니다.
LEDGER_CURRENCY_CONFIRM_REQUIRED=기준통화는 나중에 바꿀 수 없습니다. 확인 후 진행해주세요.
LEDGER_OWNER_CANNOT_LEAVE=소유자는 나갈 수 없습니다. 소유권을 넘긴 뒤 나가주세요.
LEDGER_SINGLE_OWNER_VIOLATION=가계부의 소유자는 한 명이어야 합니다.

INVITE_NOT_FOUND=초대 코드를 찾을 수 없습니다.
INVITE_EXPIRED=만료된 초대 코드입니다.
INVITE_REVOKED=무효화된 초대 코드입니다.
INVITE_EXHAUSTED=사용 횟수를 모두 쓴 초대 코드입니다.
INVITE_ALREADY_MEMBER=이미 이 가계부의 멤버입니다.
INVITE_CODE_DUPLICATED=초대 코드를 발급하지 못했습니다. 다시 시도해주세요.

ACCOUNT_NOT_FOUND=계정을 찾을 수 없습니다.
ACCOUNT_NOT_ACCESSIBLE=이 가계부에서는 쓸 수 없는 계정입니다.
ACCOUNT_NAME_DUPLICATED=같은 이름의 계정이 이미 있습니다.
ACCOUNT_ARCHIVED=보관 처리된 계정입니다.
ACCOUNT_HAS_TRANSACTIONS=거래가 있는 계정입니다. 삭제 대신 보관해주세요.
ACCOUNT_SHARE_TARGET_INVALID=멤버가 아닌 가계부에는 계정을 공유할 수 없습니다.
ACCOUNT_NATURE_INVALID=이 계정은 그런 용도로 쓸 수 없습니다.
OPENING_BALANCE_ALREADY_SET=이미 개설 잔액이 등록된 계정입니다.

CATEGORY_NOT_FOUND=분류를 찾을 수 없습니다.
CATEGORY_DEPTH_EXCEEDED=분류는 2단계까지만 만들 수 있습니다.
CATEGORY_KIND_MISMATCH=하위 분류는 상위 분류와 종류가 같아야 합니다.
CATEGORY_NOT_LEAF=거래는 하위 분류가 없는 분류에만 달 수 있습니다.
CATEGORY_NAME_DUPLICATED=같은 상위 분류 밑에 같은 이름이 이미 있습니다.
CATEGORY_HAS_CHILDREN=하위 분류가 있는 분류입니다.
CATEGORY_HAS_TRANSACTIONS=이미 거래가 등록된 분류입니다.
CATEGORY_LEDGER_MISMATCH=다른 가계부의 분류입니다.

TRANSACTION_CURRENCY_MISMATCH=거래 통화는 계정 통화와 같아야 합니다.
TRANSACTION_AMOUNT_INVALID=금액은 0보다 커야 합니다.
TRANSACTION_IDEMPOTENCY_KEY_REUSED=같은 거래 요청 키가 다른 내용에 이미 사용되었습니다.

FX_RATE_UNAVAILABLE=해당 날짜의 환율을 구할 수 없습니다.
FX_SERVICE_UNAVAILABLE=환율 서비스가 응답하지 않습니다. 잠시 후 다시 시도해주세요.
FX_RATE_INVALID=환율 값이 올바르지 않습니다.
CURRENCY_NOT_SUPPORTED=지원하지 않는 통화입니다.

JOURNAL_ENTRY_NOT_FOUND=분개를 찾을 수 없습니다.
JOURNAL_ENTRY_UNBALANCED=차변과 대변의 합이 맞지 않습니다.
JOURNAL_ENTRY_SHAPE_INVALID=분개에는 차변과 대변이 각각 최소 한 줄씩 있어야 합니다.
JOURNAL_LINE_ACCOUNT_INVALID=이 분개에 쓸 수 없는 계정입니다.
JOURNAL_LINE_DUPLICATE_ACCOUNT=같은 계정을 차변과 대변에 함께 둘 수 없습니다.
