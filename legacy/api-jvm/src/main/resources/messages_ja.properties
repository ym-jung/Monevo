INTERNAL_ERROR=予期しないエラーが発生しました。しばらくしてからもう一度お試しください。
VALIDATION_FAILED=入力値が正しくありません。詳細をご確認ください。
NOT_FOUND=リクエストされたリソースが見つかりません。
METHOD_NOT_ALLOWED=このパスでは使用できないメソッドです。
CONCURRENT_MODIFICATION=編集中に他の場所で内容が更新されました。読み込み直してからもう一度お試しください。
RATE_LIMITED=リクエストが多すぎます。しばらくしてからもう一度お試しください。

UNAUTHENTICATED=ログインが必要です。
TOKEN_EXPIRED=セッションの有効期限が切れました。もう一度ログインしてください。
TOKEN_INVALID=無効なトークンです。
AUTH_USER_NOT_PROVISIONED=まだ準備が完了していないアカウントです。管理者にお問い合わせください。
FORBIDDEN=権限がありません。
ADMIN_REQUIRED=管理者権限が必要です。

EMAIL_ALREADY_EXISTS=既に使用されているメールアドレスです。
USER_PENDING_APPROVAL=管理者の承認待ちのアカウントです。
USER_REJECTED=登録が却下されたアカウントです。
USER_SUSPENDED=利用が停止されているアカウントです。
USER_NOT_FOUND=ユーザーが見つかりません。
USER_ALREADY_PROCESSED=既に処理済みのリクエストです。
CANNOT_MODIFY_SELF=自分のアカウントには行えない操作です。

LEDGER_NOT_FOUND=家計簿が見つかりません。
LEDGER_NOT_MEMBER=この家計簿のメンバーではありません。
LEDGER_OWNER_REQUIRED=家計簿のオーナーのみ実行できます。
LEDGER_CURRENCY_CONFIRM_REQUIRED=基準通貨は後から変更できません。確認のうえ進めてください。
LEDGER_OWNER_CANNOT_LEAVE=オーナーは退出できません。先に所有権を譲渡してください。
LEDGER_SINGLE_OWNER_VIOLATION=家計簿のオーナーは1人でなければなりません。

INVITE_NOT_FOUND=招待コードが見つかりません。
INVITE_EXPIRED=有効期限が切れた招待コードです。
INVITE_REVOKED=無効化された招待コードです。
INVITE_EXHAUSTED=使用回数の上限に達した招待コードです。
INVITE_ALREADY_MEMBER=既にこの家計簿のメンバーです。
INVITE_CODE_DUPLICATED=招待コードを発行できませんでした。もう一度お試しください。

ACCOUNT_NOT_FOUND=口座が見つかりません。
ACCOUNT_NOT_ACCESSIBLE=この家計簿では使用できない口座です。
ACCOUNT_NAME_DUPLICATED=同じ名前の口座が既にあります。
ACCOUNT_ARCHIVED=アーカイブ済みの口座です。
ACCOUNT_HAS_TRANSACTIONS=取引が登録されている口座です。削除ではなくアーカイブしてください。
ACCOUNT_SHARE_TARGET_INVALID=メンバーではない家計簿に口座を共有することはできません。
ACCOUNT_NATURE_INVALID=この口座はその用途では使えません。
OPENING_BALANCE_ALREADY_SET=この口座には既に開始残高が登録されています。

CATEGORY_NOT_FOUND=カテゴリが見つかりません。
CATEGORY_DEPTH_EXCEEDED=カテゴリは2階層までです。
CATEGORY_KIND_MISMATCH=子カテゴリは親と種別が一致している必要があります。
CATEGORY_NOT_LEAF=取引は子を持たないカテゴリにのみ登録できます。
CATEGORY_NAME_DUPLICATED=同じ親の下に同じ名前のカテゴリが既にあります。
CATEGORY_HAS_CHILDREN=子カテゴリを持つカテゴリです。
CATEGORY_HAS_TRANSACTIONS=既に取引が登録されているカテゴリです。
CATEGORY_LEDGER_MISMATCH=別の家計簿のカテゴリです。

TRANSACTION_CURRENCY_MISMATCH=取引の通貨は口座の通貨と一致している必要があります。
TRANSACTION_AMOUNT_INVALID=金額は0より大きい必要があります。
TRANSACTION_IDEMPOTENCY_KEY_REUSED=同じ取引リクエストキーが異なる内容に既に使用されています。

FX_RATE_UNAVAILABLE=その日付の為替レートを取得できません。
FX_SERVICE_UNAVAILABLE=為替レートサービスが応答していません。しばらくしてからもう一度お試しください。
FX_RATE_INVALID=為替レートの値が正しくありません。
CURRENCY_NOT_SUPPORTED=サポートされていない通貨です。

JOURNAL_ENTRY_NOT_FOUND=仕訳が見つかりません。
JOURNAL_ENTRY_UNBALANCED=借方と貸方の合計が一致していません。
JOURNAL_ENTRY_SHAPE_INVALID=仕訳には借方と貸方がそれぞれ1行以上必要です。
JOURNAL_LINE_ACCOUNT_INVALID=この仕訳では使えない口座です。
JOURNAL_LINE_DUPLICATE_ACCOUNT=同じ口座を借方と貸方の両方に置くことはできません。
